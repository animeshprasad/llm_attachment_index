[tool.poetry]
name = "llm_attachment_index"
version = "0.1.0"
description = "LLM Attachment Index"
authors = ["Animesh Prasad <animeshprasad3@gmail.com>"]
readme = "README.md"
packages = [{include = "llm_attachment_index", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
openai = "^1.2.0"
transformers = "^4.36.0"
pandas = "^2.1.0"
torch = "^2.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"] 